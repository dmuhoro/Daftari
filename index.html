<!doctype html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="alternate icon" href="/pwa-192x192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daftari" />
    <meta name="description" content="Daftari — daftari ya biashara kwa wafanyabiashara wa mitaani Kenya" />
    <meta property="og:title" content="Daftari — Business Ledger for Kenyan SMEs" />
    <meta property="og:description" content="Track sales, expenses, M-Pesa payments, inventory, and customers — all offline." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://daftari.app" />
    <meta property="og:image" content="https://daftari.app/pwa-192x192.svg" />
    <title>Daftari</title>
    <script>
      (function() {
        var theme = localStorage.getItem('daftari-store');
        if (theme) {
          try {
            var parsed = JSON.parse(theme);
            var t = parsed?.state?.theme;
            if (t === 'dark' || (t === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)) {
              document.documentElement.classList.add('dark');
            }
          } catch(e) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
