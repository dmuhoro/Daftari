<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftari — Page Not Found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 1.5rem;
    }
    .card {
      background: white;
      border-radius: 1.5rem;
      padding: 2.5rem;
      text-align: center;
      max-width: 22rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .logo {
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 0.75rem;
      background: #16a34a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
    }
    .logo span { color: white; font-size: 1.5rem; font-weight: 900; }
    h1 { font-size: 1.25rem; font-weight: 700; color: #1c1917; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: #78716c; line-height: 1.5; margin-bottom: 1.5rem; }
    a {
      display: inline-block;
      background: #16a34a;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      transition: background 0.2s;
    }
    a:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span>D</span></div>
    <h1>Page not found</h1>
    <p>This page doesn't exist. Daftari works offline — make sure you're on the right screen.</p>
    <a href="/">Back to Daftari</a>
  </div>
</body>
</html>
